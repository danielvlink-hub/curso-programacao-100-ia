<!--
  BROWSE — Reservas (FastPousada, Bloco 2, aula gravada de 08/11/2026)
  Daniel: "as reservas devem ser sofisticadas, agendas de arrastar para reservas" / "teremos motor de reserva on-line".
  O QUE É: a lista de reservas (código, hóspede, quarto, datas, noites, situação colorida, origem, total), com busca,
    filtros de situação e origem, Nova reserva (UpdateReservas.html na janela central), botão Mapa (agenda de arrastar),
    Relatório, CSV, XLSX e a Luninha das reservas (IA e VOZ). A lixeira vira "Cancelar reserva" (pede o motivo).
  COMO: ficha assets/js/cadastros/Reservas.js + motor CadastroPadrao.js. Regras na API (Reservas.cs).
-->
<script>
  // tema escolhido no menu (e troca ao vivo)
  (function () {
    try { var t = localStorage.getItem('facilapp_tema_ativo'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    window.addEventListener('message', function (e) {
      var m = e.data || {}, t = String(m.tema || m.skinId || '');
      if (m.origem === 'FACILAPP_TEMA_ALTERADO' && /^[a-z0-9-]+$/.test(t)) {
        document.documentElement.setAttribute('data-theme', t);
        var f = document.querySelector('#janelaUpdate iframe');
        if (f && f.contentWindow) f.contentWindow.postMessage(m, '*');
      }
    });
  })();
</script>
