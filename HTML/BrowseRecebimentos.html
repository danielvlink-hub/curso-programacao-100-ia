<title>Recebimentos</title>
<!--
  BROWSE — Recebimentos (FastPousada, Bloco 4, aula gravada de 08/11/2026). Daniel: "Sim, Bloco 4".
  O QUE É: todo dinheiro que entrou (data/hora, hóspede, quarto, forma, valor, caixa, observação, situação), com busca,
    filtros de mês, forma e situação, total no rodapé (sem estornados), botão Caixa, Relatório, CSV, XLSX e a Luninha
    do caixa (IA e VOZ). Somente leitura: o recebimento nasce na conta do hóspede. A lixeira vira "Estornar" (motivo).
  COMO: ficha assets/js/cadastros/Recebimentos.js + motor CadastroPadrao.js. Regras na API (Caixa.cs e Operacao.cs).
-->
<script>
  // tema escolhido no menu (e troca ao vivo)
  (function () {
    try { var t = localStorage.getItem('facilapp_tema_ativo'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    window.addEventListener('message', function (e) {
      var m = e.data || {}, t = String(m.tema || m.skinId || '');
      if (m.origem === 'FACILAPP_TEMA_ALTERADO' && /^[a-z0-9-]+$/.test(t)) {
        document.documentElement.setAttribute('data-theme', t);
        var f = document.querySelector('#janelaUpdate iframe');
        if (f && f.contentWindow) f.contentWindow.postMessage(m, '*');
      }
    });
  })();
</script>
<script src="assets/js/avisos.js"></script>
