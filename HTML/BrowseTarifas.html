<!DOCTYPE html>
<html lang="pt-BR" data-theme="verde-claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarifas</title>
<!--
  BROWSE — Tarifas (FastPousada, Bloco 1, aula gravada de 08/11/2026)
  Daniel: "gere todas as telas faltantes, use do minimalismo em campos, não coloque o que não seja necessário".
  O QUE É: o preço por tipo, período e dias da semana, com mínimo de noites (cálculo noite a noite).
  COMO FUNCIONA: a ficha assets/js/cadastros/Tarifas.js descreve campos, colunas e filtros; o motor
    assets/js/CadastroPadrao.js monta a lista (Tabulator): busca, filtros, Novo (janela central com UpdateTarifas.html),
    Relatório (RptTarifas.html), CSV, XLSX, alterar/excluir na linha, duplo clique, e os botões IA e VOZ da Luninha.
  DADOS: ApiCurso.cadastro* → FacilApp API SQL (Cadastros.cs). A regra de verdade fica na API.
-->
<script>
  // tema escolhido no menu (e troca ao vivo)
  (function () {
    try { var t = localStorage.getItem('facilapp_tema_ativo'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    window.addEventListener('message', function (e) {
      var m = e.data || {}, t = String(m.tema || m.skinId || '');
      if (m.origem === 'FACILAPP_TEMA_ALTERADO' && /^[a-z0-9-]+$/.test(t)) {
        document.documentElement.setAttribute('data-theme', t);
        var f = document.querySelector('#janelaUpdate iframe');
        if (f && f.contentWindow) f.contentWindow.postMessage(m, '*');
      }
    });
  })();
</script>
<script src="assets/js/avisos.js"></script>
<link rel="stylesheet" href="assets/fonts/offline-fonts.css">
<link rel="stylesheet" href="assets/css/TemaFacilApp.css">

<script src="assets/js/BotaoIA.js"></script>
<script src="assets/js/BotaoVoz.js"></script>

<script src="assets/js/cadastros/Tarifas.js"></script>
</head>

  // monta a lista desta ficha (o motor cria a tela inteira)
  window.addEventListener('DOMContentLoaded', function () { CadastroPadrao.browse(window.FICHA); });
</script>
</body>
</html>
