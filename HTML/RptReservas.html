<!DOCTYPE html>
<html lang="pt-BR" data-theme="verde-claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas — relatório</title>
<!--
  RELATÓRIO — Reservas (FastPousada, Bloco 2, aula gravada de 08/11/2026)
  O QUE FAZ: filtros de situação e origem, prévia A4, PDF, Imprimir, CSV e XLSX das reservas.
  Montado pelo motor CadastroPadrao.relatorio com a ficha assets/js/cadastros/Reservas.js.
-->
<script>
  // tema escolhido no menu (e troca ao vivo)
  (function () {
    try { var t = localStorage.getItem('facilapp_tema_ativo'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    window.addEventListener('message', function (e) {
      var m = e.data || {}, t = String(m.tema || m.skinId || '');
      if (m.origem === 'FACILAPP_TEMA_ALTERADO' && /^[a-z0-9-]+$/.test(t)) {
        document.documentElement.setAttribute('data-theme', t);
        var f = document.querySelector('#janelaUpdate iframe');
        if (f && f.contentWindow) f.contentWindow.postMessage(m, '*');
      }
    });
  })();
</script>
<script src="assets/js/avisos.js"></script>
<link rel="stylesheet" href="assets/fonts/offline-fonts.css">
<link rel="stylesheet" href="assets/css/TemaFacilApp.css">
<link rel="stylesheet" href="assets/css/CadastroPadrao.css">
<script src="dependencias/jspdf-2.5.1/jspdf.umd.min.js"></script>
<script src="dependencias/sheetjs-0.20.3/js/xlsx.full.min.js"></script>
<script src="assets/js/ApiCurso.js"></script>
<script src="assets/js/CadastroPadrao.js"></script>
<script src="assets/js/cadastros/Reservas.js"></script>
</head>

  window.addEventListener('DOMContentLoaded', function () { CadastroPadrao.relatorio(window.FICHA); });
</script>
</body>
</html>
